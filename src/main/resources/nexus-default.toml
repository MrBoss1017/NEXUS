# NEXUS: COSMIC DOMINION — Minecraft 26.3 / Fabric
# Edit with a plain text editor. /nexus reload validates changes atomically.
# 20 server ticks = 1 second. Minecraft damage is health points (2 points = 1 heart).
# Attack damage/radius below remain in original Luau units. Global scales convert them.
# Damage formula: source damage * 2 * damage_scale * (1 - distance/radius).
# Armor, vanilla invulnerability frames, team/PvP rules still apply.

[general]
schema_version = 1
boss_health = 600.0 # Source: 6000 HP; Minecraft attribute maximum is 1024.
damage_scale = 0.02 # Baseline lightning center hit: 220 * 2 * .02 = 8.8 HP.
source_damage_multiplier = 2.0 # ApplyDamage in the Luau doubles its input.
range_scale = 0.1 # 10 Roblox studs -> 1 Minecraft block.
knockback_scale = 0.008 # Velocity conversion; final impulse capped at 2 blocks/tick.
single_boss = true
require_core = true # Operators/creative players bypass inventory requirement.
affect_players = true # Also honors the world's PvP rule and allied teams.
affect_hostile_mobs = true
affect_passive_mobs = false
break_blocks = false # Optional small block-damage radius; no block entities/bedrock.
allow_boss_healing = false # Recruitment intentionally bypasses this, as in source.
global_cooldown_ticks = 6 # Source minimum: 0.3 sec.
intro_ticks = 100
# UUID strings only; empty replaces the source's hard-coded Roblox username.
auto_activate_uuids = []

[ai]
detection_range_blocks = 40.0
attack_range_blocks = 24.0
attack_interval_ticks = 16 # Source: .8 sec. Cast locks and per-power cooldowns also apply.
movement_speed = 0.22

[minions]
recruit_players = true
recruit_mobs = true
contact_range_blocks = 1.3
recruit_cooldown_ticks = 20 # Source touch debounce: 1 sec.
support_interval_ticks = 100 # Source: every 5 sec during the finale.
support_heal = 1.0 # NPCs heal nearby recruited allies once per second.
npc_lifetime_ticks = 2400
npc_health_scale = 0.1
npc_damage_scale = 1.0

[infection]
enabled = true # The source contains unhooked clone functions; the panel wires them up.

[finale]
enabled = true
phase_ticks = 360 # 34 phases x 18 sec = 10 min 12 sec. Scaled pacing, original order.

[status]
stun_ticks = 40
burn_ticks = 80
burn_interval_ticks = 10
burn_source_damage = 5.0
freeze_ticks = 60
slow_ticks = 100
vulnerability_ticks = 120
vulnerability_multiplier = 1.5 # Luau calls this Weakness; it INCREASES incoming damage.
blind_ticks = 80
levitate_ticks = 60

[stomp]
damage = 9.0 # Minecraft HP. Source direct damage: 45.
cooldown_ticks = 800 # Source: 40 sec per attacker.

[visuals]
sound_volume = 0.3 # Source master multiplier: .3. Uses Minecraft sounds.
taunts = true

[performance]
particles_per_tick = 384 # Global packet/particle budget, all encounters combined.
max_effects = 256 # Pending + active timed mechanics.
max_targets_per_hit = 64
max_minions = 32
max_npcs = 24

# Per-ability cooldown starts after its cast duration (source completion timestamp).
# windup_ticks is the warning before activation; pulses bounds repeated strikes.
# lingering_damage is used by lingering fields where applicable.
# Finale uses finale.phase_ticks for duration; its finisher is the source's last blast.

